[project]
name = "consensus-freeze-iter5"
version = "0.1.0"
description = "Iteration-5 FREEZE: label-free consensus rescoring screen (V0-V5) on dataset E + gloss-gated name-free agreement (GG) + vendored consensus library"
requires-python = ">=3.12"
# versions follow eval-2's pinned environment (z3-solver pinned = exp 5 / eval-2 matrix, z3 5.1.0)
dependencies = [
  "numpy==2.5.3",
  "pandas==3.0.6",
  "scipy==1.18.1",
  "scikit-learn==1.9.1",
  "loguru==0.7.3",
  "z3-solver==5.1.0.0",
  "httpx",
  "pyyaml==6.0.3",
  "pytest==9.1.1",
  "psutil==7.2.2",
  "tenacity",
  "statsmodels==0.15.0",
  "nltk",
]
