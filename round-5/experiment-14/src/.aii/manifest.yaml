entries:
  - path: .venv/
    delete: regenerable
    source: "uv venv .venv --python=3.12 && uv pip install --python .venv/bin/python -r pyproject.toml"
  - path: "**/__pycache__/"
    delete: regenerable
    source: "created automatically by any .venv/bin/python src/*.py or pytest run"
  - path: .pytest_cache/
    delete: regenerable
    source: ".venv/bin/python -m pytest -q"
