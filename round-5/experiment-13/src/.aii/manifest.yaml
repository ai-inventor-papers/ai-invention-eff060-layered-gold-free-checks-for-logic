entries:
  - path: .venv/
    delete: regenerable
    source: "uv venv .venv --python=3.12 && uv pip install --python .venv/bin/python -r pyproject.toml"
  - path: "**/__pycache__/"
    delete: regenerable
    source: "python regenerates bytecode caches automatically on import"
  - path: "**/.pytest_cache/"
    delete: regenerable
    source: "uv run pytest -c pytest.ini"
