entries:
  - path: e2src/.venv/
    delete: regenerable
    source: "cd e2src && uv venv .venv --python=3.12 && uv pip install --python=.venv/bin/python -r pyproject.toml"
  - path: e2src/nltk_data/
    delete: redownloadable
    source: "e2src/.venv/bin/python -c \"import nltk; [nltk.download(p, download_dir='e2src/nltk_data') for p in ('wordnet','omw-1.4')]\""
  - path: frozen/nltk_data/
    delete: redownloadable
    source: "e2src/.venv/bin/python -c \"import nltk; [nltk.download(p, download_dir='frozen/nltk_data') for p in ('wordnet','omw-1.4','words','stopwords')]\""
  - path: e2src/.pytest_cache/
    delete: regenerable
    source: "cd e2src && .venv/bin/python -m pytest -q -c pytest.ini tests/test_fol.py"
