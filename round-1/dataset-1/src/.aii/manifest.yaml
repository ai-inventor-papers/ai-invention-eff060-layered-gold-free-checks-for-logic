entries:
  - path: .venv/
    delete: regenerable
    source: "uv venv .venv --python=3.12 && uv pip install --python=.venv/bin/python -r pyproject.toml"
  - path: nltk_data/
    delete: redownloadable
    source: ".venv/bin/python -c \"import nltk; [nltk.download(p, download_dir='nltk_data') for p in ('wordnet','omw-1.4')]\""
  - path: raw/hf/
    delete: redownloadable
    source: ".venv/bin/python -c \"from huggingface_hub import hf_hub_download as d; [d('tasksource/folio', f, repo_type='dataset', local_dir='raw/hf/tasksource__folio') for f in ('folio_v2_train.jsonl','folio_v2_validation.jsonl')]; [d('kenken6696/folio_by_ccg2lambda', f, repo_type='dataset', local_dir='raw/hf/kenken6696__folio_by_ccg2lambda') for f in ('data/train-00000-of-00001.parquet','data/valid-00000-of-00001.parquet')]\""
  - path: __pycache__/
    delete: regenerable
    source: "python bytecode cache; recreated on import"
  - path: src/__pycache__/
    delete: regenerable
    source: "python bytecode cache; recreated on import"
  - path: tests/__pycache__/
    delete: regenerable
    source: "python bytecode cache; recreated on import"
  - path: labeller/__pycache__/
    delete: regenerable
    source: "python bytecode cache; recreated on import"
  - path: .pytest_cache/
    delete: regenerable
    source: ".venv/bin/python -m pytest -q -c pytest.ini tests/test_fol.py"
