entries:
  - path: .venv/
    delete: regenerable
    source: "./restore.sh  (uv venv .venv --python=3.12 && uv pip install --python .venv/bin/python -r requirements.txt)"
  - path: cache/
    delete: regenerable
    source: ".venv/bin/python src/run_scoring.py E --stage all && .venv/bin/python src/run_scoring.py screen --stage all"
  - path: src/__pycache__/
    delete: regenerable
    source: "python bytecode, recreated automatically on import (.venv/bin/python -m compileall src)"
  - path: src/vendor_a/__pycache__/
    delete: regenerable
    source: ".venv/bin/python -m compileall src/vendor_a"
  - path: src/vendor_c/__pycache__/
    delete: regenerable
    source: ".venv/bin/python -m compileall src/vendor_c"
  - path: src/vendor_d/__pycache__/
    delete: regenerable
    source: ".venv/bin/python -m compileall src/vendor_d"
  - path: src/vendor_e/__pycache__/
    delete: regenerable
    source: ".venv/bin/python -m compileall src/vendor_e"
  - path: vendor_e6/src/__pycache__/
    delete: regenerable
    source: ".venv/bin/python -m compileall vendor_e6/src"
  - path: vendor_e6/src/labeller/__pycache__/
    delete: regenerable
    source: ".venv/bin/python -m compileall vendor_e6/src/labeller"
  - path: tests/__pycache__/
    delete: regenerable
    source: ".venv/bin/python -m compileall tests"
