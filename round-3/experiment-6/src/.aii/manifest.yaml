entries:
  - path: .venv/
    delete: regenerable
    source: "bash restore.sh venv"
  - path: src/__pycache__/
    delete: regenerable
    source: "any .venv/bin/python run of method.py recreates it"
  - path: src/labeller/__pycache__/
    delete: regenerable
    source: "any .venv/bin/python run of method.py recreates it"
